{% load static %}

{% if role == 'bot' %}
<div class="message bot-message">
    <img width="35" height="35" 
         style="vertical-align: middle; margin-right: 8px; margin-bottom:10px;" 
         src="{% static 'images/bot.png' %}">
    <strong>InvestiChat:</strong><br>
    {{ message|linebreaks }}
</div>
{% else %}
<div class="message user-message" style="background-color:#e3f2fd; text-align:right; margin-bottom:10px; padding:8px;">
    <strong>Você:</strong> {{ message|linebreaksbr }}
</div>
{% endif %}
