<html>
    <head>
        {% load static %}
        <link rel="stylesheet" href="{% static 'chatbot.css' %}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>InvestiChat</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <header>
        <div id="chatbot-header">
            <img id="chatbot-logo" src="{% static 'images/investichattransparent.png' %}">
            {% if user.is_authenticated %}
            <span>Bem-vindo, {{ user.username }}</span>
            {% else %}
            <span>Faça seu login</span>
            {% endif %}
        </div>
    </header>
    <body>
        <div class="container">
        <div class="chatbot-title-bar">
            <h1 style="margin: 0;">Investichat</h1>
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            {% endif %}
        </div>
        <div id="chatbot-container">
            <div id="chat-messages">
                <div class="message bot-message">
                    <img width="35" height="35" style="vertical-align: middle; margin-right: 8px; margin-bottom: 7px" src="{% static 'images/moneybot.png' %}"><strong>InvestiChat:</strong>
                    <br>Olá! Sou seu assistente de investimentos. Como posso ajudá-lo hoje?
                </div>
            </div>
            
            <div id="chatbot-container-msg">
                <textarea id="user-input" placeholder="Digite sua mensagem aqui..."></textarea>
                <br><br>
                <button id="send-button">Enviar</button>
                <button id="clear-button">Limpar Chat</button>
            </div>
        </div>

        <script>
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const clearButton = document.getElementById('clear-button');

            function addMessage(message, isUser = false) {
                const messageDiv = document.createElement('div');
                if (isUser) {
                    messageDiv.className = 'message user-message';
                } else {
                    messageDiv.className = 'message bot-message';
                }
                messageDiv.style.marginBottom = '10px';
                messageDiv.style.padding = '8px';
                messageDiv.style.borderRadius = '5px';
                
                if (isUser) {
                    messageDiv.style.backgroundColor = '#e3f2fd';
                    messageDiv.style.textAlign = 'right';
                    messageDiv.innerHTML = `<strong>Você:</strong> ${message}`;
                } else {
                    messageDiv.style.backgroundColor = '#f1f8e9';
                    messageDiv.innerHTML = `<img width="35" height="35" style="vertical-align: middle; margin-right: 8px; margin-bottom: 7px" src="{% static 'images/moneybot.png' %}"><strong>InvestiChat:</strong><br>${message}`;
                }
                
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            function sendMessage() {
                const message = userInput.value.trim();
                if (!message) return;

                // Adiciona mensagem do usuário
                addMessage(message, true);
                
                // Limpa o input
                userInput.value = '';
                
                // Desabilita o botão durante o envio
                sendButton.disabled = true;
                sendButton.textContent = 'Enviando...';

                // Envia para o backend
                fetch('/chatbot/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addMessage(data.response);
                    } else {
                        addMessage('Erro: ' + (data.error || 'Erro desconhecido'));
                    }
                })
                .catch(error => {
                    console.error('Erro:', error);
                    addMessage('Erro de conexão. Tente novamente.');
                })
                .finally(() => {
                    sendButton.disabled = false;
                    sendButton.textContent = 'Enviar';
                });
            }

            function clearChat() {
                chatMessages.innerHTML = `<div class="message bot-message"><img width="35" height="35" style="vertical-align: middle; margin-right: 8px; margin-bottom: 7px" src="{% static 'images/moneybot.png' %}"><strong>InvestiChat:</strong><br>Olá! Sou seu assistente de investimentos. Como posso ajudá-lo hoje?</div>`;
            }

            // Event listeners
            sendButton.addEventListener('click', sendMessage);
            clearButton.addEventListener('click', clearChat);
            
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        </script>
    </body>
</html>
