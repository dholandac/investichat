<html>
    <head>
        {% load static %}
        <link rel="stylesheet" href="{% static 'login.css' %}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <header>
        <div id="login-header">
            <img id="login-logo" src="{% static 'images/investichattransparent.png' %}">
            {% if user.is_authenticated %}
            <span>Bem-vindo, {{ user.username }}</span>
            {% else %}
            <a href="{% url 'login' %}"><span>Faça seu login</span></a>
            {% endif %}
        </div>
    </header>
    <body>
        <form action="{% url 'login' %}" method="POST" id="login-form">{% csrf_token %}
            <h1 id="login-title">Login</h1>
            <span>Usuário:</span><input type="text" name="username"/>
            <br>
            <span>Senha:</span><input type="password" name="senha"/>
            <br>
            <input type="submit" value="Logar" id="login-submit">
            <br>
            {% if mensagem %}
            <p id="login-feedback">{{ mensagem }}</p>
            <script>
                setTimeout(function() {
                document.getElementById('login-feedback').style.display = 'none';
                }, 3000);
            </script>
            {% endif %}
        </form>
    </body>
</html>
