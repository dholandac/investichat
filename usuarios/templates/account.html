<html>
    <head>
        {% load static %}
        <title>Investichat</title>
        <link rel="icon" href="{% static 'images/investichattransparent.png' %}" type="image/x-icon">
        <link rel="stylesheet" href="{% static 'account.css' %}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <header>
        <div id="account-header">
            <a href="{% url 'chatbot' %}"><img id="account-logo" src="{% static 'images/investichattransparent.png' %}"></a>
            {% if user.is_authenticated %}
            <a href="{% url 'account' %}"><span>Bem-vindo, {{ user.username }}<img id="user-icon" width="25" height="25" src="{% static 'images/user.png' %}"/></span></a>
            {% else %}
            <a href="{% url 'login' %}"><span>Faça seu login</span></a>
            {% endif %}
        </div>
        <div id="account-container">
            {% if user.is_authenticated %}
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            {% endif %}
            <h1>Conta</h1>
            <br>
            <div class="account-info">
                <strong>Usuário: </strong><span>{{ user.username }}</span>
            </div>
            <div class="account-info">
                <strong>Email: </strong><span>{{ user.email }}</span><img id="user-edit" width="20" height="20" src="{% static 'images/edit.png' %}"/>
            </div>
            <div class="account-info">
                <strong>Perfil de Investidor: </strong><span>{{ user.profile_type }}</span>
            </div>
        </div>
    </header>
    <body>
       
    </body>
</html>
